name: Sign Text Door Shortcut
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/text-door-sign.yml
      - tools/text-door/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and sign using Apple Shortcuts
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, plistlib, subprocess, sys
          src = pathlib.Path('tools/text-door/workflow-source.json')
          obj = json.loads(src.read_text())
          assert len(obj['WFWorkflowActions']) == 58
          out = pathlib.Path('shortcut-output')
          out.mkdir()
          unsigned = pathlib.Path('text-door-unsigned.shortcut')
          unsigned.write_bytes(plistlib.dumps(obj, fmt=plistlib.FMT_BINARY))
          signed = out / 'text-door-v2.shortcut'
          cmd = ['/usr/bin/shortcuts', 'sign', '--mode', 'anyone', '--input', str(unsigned.resolve()), '--output', str(signed.resolve())]
          try:
              run = subprocess.run(cmd, capture_output=True, text=True, timeout=180)
              log = f'exit_code={run.returncode}\n{run.stdout}\n{run.stderr}'
              ok = run.returncode == 0 and signed.exists() and signed.stat().st_size > 0
          except subprocess.TimeoutExpired as exc:
              log = 'Signing timed out after 180 seconds. No signed output is certified.\n'
              for value in (exc.stdout, exc.stderr):
                  if value:
                      log += value.decode(errors='replace') if isinstance(value, bytes) else value
              ok = False
          (out / 'signing-result.txt').write_text(log)
          print(log)
          if not ok:
              signed.unlink(missing_ok=True)
              sys.exit(1)
          assert not signed.read_bytes().startswith(b'bplist00'), 'Output is still an unsigned plist'
          print(f'Signed output: {signed.stat().st_size} bytes. iPhone import still needs testing.')
          PY
      - name: Upload signed shortcut or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-door-signing-result
          path: shortcut-output/
          if-no-files-found: error
          retention-days: 7
